<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QwenBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    button, input, select, textarea { font-family: inherit; }
    body {
      font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background-color: #ffffff;
      color: #1f2937;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Side Lines - Inset 15% top/bottom, tight to scrollbar */
    .side-line {
      position: absolute;
      top: 15%;
      bottom: 15%;
      width: 3px;
      background-color: #e5e7eb;
      z-index: 5;
    }
    .side-line.left { left: max(4px, calc(50% - 372px)); }
    .side-line.right { left: min(calc(100% - 7px), calc(50% + 369px)); }

    #brand-dot { display: inline-block; width: 0.26em; height: 0.26em; border-radius: 50%; background: #9ca3af; margin-right: 0.2em; vertical-align: middle; transition: background 0.3s ease; }
    #brand-dot.ready { background: #3b82f6; }
    /* logo: same height as a capital letter of the brand text (about 0.71em), sitting on the text baseline */
    #brand-logo { display: inline-block; height: 0.71em; width: 0.71em; object-fit: cover; border-radius: 0.1em; margin-left: 0.16em; vertical-align: baseline; }
    /* ". . ." shown in the chat while waiting for the first words (no bubble is drawn) */
    .wait-dots { display: inline-block; color: #6b7280; font-size: 26px; font-weight: 700; line-height: 1; letter-spacing: 1px; }
    .wait-dots i { font-style: normal; animation: waitPulse 1.2s infinite ease-in-out; }
    .wait-dots i:nth-child(2) { animation-delay: 0.2s; }
    .wait-dots i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes waitPulse { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
    /* Top-left brand */
    .brand {
      position: absolute;
      top: 14px;
      left: 24px;
      z-index: 20;
      font-weight: 700;
      font-size: 53px;
      letter-spacing: -0.8px;
      color: #333333;
      transform: scaleY(0.96);
      transform-origin: left center;
      pointer-events: none;
      user-select: none;
    }

    /* Top Utility Controls */
    .top-controls {
      position: absolute;
      top: 20px;
      right: 24px;
      z-index: 20;
    }
    .settings-btn {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #e5e7eb;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #4b5563;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .settings-btn:hover { background: rgba(243, 244, 246, 0.9); }

    .settings-dropdown {
      position: absolute;
      top: 50px;
      right: 0;
      width: 320px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 30;
      font-size: 13px;
    }
    .settings-dropdown.active { display: flex; }

    .setting-group { display: flex; flex-direction: column; gap: 6px; }
    .setting-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      color: #374151;
      font-size: 12px;
      outline: none;
    }
    .setting-hint { font-size: 11px; color: #6b7280; line-height: 1.4; }
    .setting-hint a { color: #374151; }
    .setting-label { font-weight: 600; color: #6b7280; font-size: 11px; text-transform: uppercase; }

    select, button.action-btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      color: #374151;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    button.action-btn { background: #f3f4f6; font-weight: 500; transition: background 0.15s; text-align: center; }
    button.action-btn:hover { background: #e5e7eb; }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #f3f4f6;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
      display: none;
    }
    .progress-bar { height: 100%; width: 0%; background: #9ca3af; transition: width 0.1s linear; }

    /* Centered Hero View */
    .hero-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .hero-logo {
      font-weight: 600;
      font-size: 44px;
      letter-spacing: -0.5px;
      color: #4b5563;
      transform: scaleY(0.95);
      margin-bottom: 12px;
    }
    .hero-text {
      font-size: 18px;
      color: #6b7280;
      font-weight: 400;
      text-align: center;
    }

    /* Main Chat Stream Container */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 40px 20px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      display: none;
      flex-direction: column;
      gap: 20px;
    }
    .chat-container.active { display: flex; }

    .msg {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      max-width: 85%;
      flex-shrink: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .fade-in { animation: fadeIn 0.5s ease-out both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .msg { contain: layout style; }

    /* Code blocks */
    .codebox {
      border: 1px solid #d1d5db;
      border-radius: 12px;
      margin: 10px 0;
      overflow: hidden;
      background: #fafafa;
      width: 100%;
    }
    .code-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px 6px 14px;
      border-bottom: 1px solid #e5e7eb;
      background: #f3f4f6;
    }
    .code-lang { font-weight: 700; font-size: 12px; color: #4b5563; }
    .code-actions { display: flex; gap: 2px; }
    .code-btn {
      background: transparent;
      border: none;
      color: #6b7280;
      cursor: pointer;
      padding: 5px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .code-btn:hover { background: #e5e7eb; color: #111827; }
    .codebox pre {
      margin: 0;
      padding: 12px 14px;
      overflow-x: auto;
      white-space: pre;
    }
    .codebox code, #pv-code code {
      color: #15803d;
      font-size: 13px;
      line-height: 1.5;
    }

    /* Image box (same look as the code box) */
    .imgbox .img-body { padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 120px; background: #ffffff; white-space: normal; }
    .imgbox img { display: block; max-width: 100%; max-height: 520px; width: auto; height: auto; border-radius: 8px; object-fit: contain; }
    .imgbox .img-status { font-size: 12px; color: #6b7280; display: flex; align-items: center; gap: 8px; text-align: center; }
    .imgbox .img-err { color: #b91c1c; }
    .imgbox .img-retry { border: 1px solid #d1d5db; background: #fff; border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: #374151; }
    .imgbox .img-retry:hover { background: #f3f4f6; }
    .img-spin { width: 14px; height: 14px; border: 2px solid #d1d5db; border-top-color: #6b7280; border-radius: 50%; animation: imgspin 0.8s linear infinite; display: inline-block; }
    @keyframes imgspin { to { transform: rotate(360deg); } }
    /* Pollinations model list (name on the left, image badge on the right) */
    .pm-list { display: none; max-height: 240px; overflow: auto; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; }
    .pm-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #f3f4f6; }
    .pm-row:last-child { border-bottom: none; }
    .pm-row:hover { background: #f9fafb; }
    .pm-row.sel { background: #eff6ff; }
    .pm-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pm-badge { font-size: 10px; color: #6d28d9; background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
    /* Math */
    .math-d { display: block; text-align: center; margin: 8px 0; overflow-x: auto; overflow-y: hidden; white-space: normal; }
    .math-i, .math-pending { white-space: normal; }
    .math-pending { font-family: 'Roboto Mono', monospace; color: #6b7280; }
    .msg .katex { white-space: normal; }

    /* White edge fades (above chat/lines/scrollbar, below buttons) */
    .fade { position: fixed; left: 0; right: 0; pointer-events: none; z-index: 10; }
    .fade-top { top: 0; height: 90px; background: linear-gradient(to bottom, #ffffff 25%, rgba(255,255,255,0) 100%); }
    .fade-bottom { bottom: 0; height: 130px; background: linear-gradient(to top, #ffffff 30%, rgba(255,255,255,0) 100%); }
    .bottom-area { z-index: 15; }

    /* Syntax colors (base code color = green = variables) */
    .codebox code .tk-ctrl, #pv-code code .tk-ctrl  { color: #7c3aed; }
    .codebox code .tk-decl, #pv-code code .tk-decl  { color: #4f46e5; }
    .codebox code .tk-const, #pv-code code .tk-const { color: #c2410c; }
    .codebox code .tk-logic, #pv-code code .tk-logic { color: #be123c; }
    .codebox code .tk-str, #pv-code code .tk-str   { color: #b45309; }
    .codebox code .tk-num, #pv-code code .tk-num   { color: #1d4ed8; }
    .codebox code .tk-com, #pv-code code .tk-com   { color: #9ca3af; font-style: italic; }
    .codebox code .tk-fn, #pv-code code .tk-fn    { color: #0e7490; }
    .codebox code .tk-type, #pv-code code .tk-type  { color: #0369a1; }
    .codebox code .tk-op, #pv-code code .tk-op    { color: #4b5563; }
    .codebox code .tk-tag, #pv-code code .tk-tag   { color: #be123c; }

    .msg.user { align-self: flex-end; background: #f3f4f6; color: #1f2937; }
    .msg.assistant { align-self: flex-start; background: transparent; color: #1f2937; border: 1px solid transparent; position: relative; }
    .msg.assistant .codebox { background: #ffffff; }
    .msg .user-img { display:block; max-width:240px; max-height:240px; border-radius:10px; margin-bottom:6px; }
    body.preview-open { padding-right: 50vw; }
    #preview-panel { display:none; position:fixed; top:0; right:0; bottom:0; width:50vw; background:#fff; border-left:1px solid #e5e7eb; z-index:60; flex-direction:column; box-shadow:-4px 0 24px rgba(0,0,0,0.05); }
    #preview-panel.open { display:flex; }
    .pv-head { display:flex; align-items:center; gap:6px; padding:8px 10px; border-bottom:1px solid #e5e7eb; font-size:12px; }
    .pv-title { flex:1; color:#6b7280; text-transform:lowercase; }
    .pv-tab, .pv-btn { background:none; border:1px solid #e5e7eb; border-radius:8px; padding:4px 9px; font-size:11px; color:#4b5563; cursor:pointer; }
    .pv-tab.on { background:#f3f4f6; color:#111827; }
    .pv-btn:hover, .pv-tab:hover { background:#f9fafb; }
    #pv-frame { flex:1; width:100%; border:0; background:#fff; }
    #pv-code { flex:1; margin:0; padding:12px 14px; overflow:auto; display:none; white-space:pre; }
    body.preview-open .side-line.left { left: max(4px, calc(25vw - 372px)); }
    body.preview-open .side-line.right { left: min(calc(50vw - 7px), calc(25vw + 369px)); }
    @media (max-width: 800px) { body.preview-open { padding-right:0; } #preview-panel { width:100vw; } body.preview-open .side-line.left { left: max(4px, calc(50% - 372px)); } body.preview-open .side-line.right { left: min(calc(100% - 7px), calc(50% + 369px)); } }
    .msg.assistant strong { font-weight: 700; }
    .msg.assistant em { font-style: italic; }
    .msg.assistant mark { background: #fef08a; color: inherit; padding: 0 3px; border-radius: 3px; }
    .msg.assistant .inline-code { font-family: 'Roboto Mono', monospace; font-size: 0.9em; background: #f3f4f6; padding: 1px 5px; border-radius: 4px; }
    /* When the reply finishes: outline draws first, then the grey fill drops down like a curtain behind a matte black CRT line */
    .msg.assistant.done { border-color: #e5e7eb; transition: border-color 0.4s ease; }
    .msg.assistant.done::before {
      content: ''; position: absolute; inset: -1px; border-radius: 12px; background: #f9fafb; z-index: -1;
      clip-path: inset(0 0 100% 0);
      animation: crtFill 0.7s linear 0.4s forwards;
    }
    .msg.assistant.done::after {
      content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; z-index: 1; opacity: 0; pointer-events: none;
      background: #000;
      animation: crtScan 0.7s linear 0.4s forwards;
    }
    @keyframes crtFill { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes crtScan { 0% { top: 0; opacity: 1; } 90% { opacity: 1; } 100% { top: calc(100% - 2px); opacity: 0; } }
    .msg.assistant.static::before { animation: none; clip-path: inset(0 0 0 0); }
    .msg.assistant.static::after { display: none; }

    /* Copy button under the AI bubble: fades in right after the curtain fill finishes (0.4s + 0.7s) */
    .msg-actions { align-self: flex-start; display: flex; margin: -14px 0 0 6px; opacity: 0; flex-shrink: 0; }
    .msg-actions.show { animation: fadeIn 0.5s ease-out 1.1s forwards; }
    .msg-actions.show.static { animation: none; opacity: 1; }

    /* Bottom Floating Area with Pill */
    .bottom-area {
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .input-pill {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #e5e7eb;
      border-radius: 30px;
      padding: 6px 10px 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 220px;
      max-width: 90%;
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      cursor: text;
    }
    .input-pill:hover, .input-pill:focus-within {
      width: 40%;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 50%;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .pill-btn:hover { color: #4b5563; }

    .input-pill input[type="text"] {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 13px;
      color: #1f2937;
      min-width: 0;
    }

    .send-btn { background: #e5e7eb; color: #4b5563; }
    .send-btn:hover { background: #d1d5db; color: #111827; }

    /* Bottom-Left Drawer */
    .history-toggle {
      position: absolute;
      bottom: 20px;
      left: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #4b5563;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      z-index: 20;
    }

    .history-drawer {
      position: absolute;
      bottom: 70px;
      left: 24px;
      width: 280px;
      height: 380px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 30;
    }
    .history-drawer.active { display: flex; }

    .search-input {
      flex-shrink: 0;
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      font-size: 12px;
      outline: none;
    }
    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .history-item {
      flex-shrink: 0;
      min-height: 34px;
      line-height: 1.4;
      padding: 9px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #4b5563;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-item:hover { background: #f3f4f6; color: #111827; }
    .history-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .hist-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hist-x { flex-shrink: 0; width: 20px; height: 20px; padding: 0; border: none; background: transparent; color: #9ca3af; border-radius: 4px; font-size: 15px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity 0.15s ease, background 0.15s ease; }
    .history-item:hover .hist-x, .hist-x:focus-visible { opacity: 1; }
    .hist-x:hover { background: #e5e7eb; color: #111827; }
    @media (hover: none) { .hist-x { opacity: 1; } }
    .hist-confirm { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; color: #111827; }
    .hist-confirm button { border: none; border-radius: 6px; padding: 3px 10px; font-size: 11px; cursor: pointer; }
    .hist-yes { background: #ef4444; color: #fff; }
    .hist-yes:hover { background: #dc2626; }
    .hist-no { background: #e5e7eb; color: #374151; }
    .hist-no:hover { background: #d1d5db; }

    .attachment-preview {
      display: none;
      font-size: 11px;
      background: #f3f4f6;
      color: #4b5563;
      padding: 2px 8px;
      border-radius: 10px;
      align-items: center;
      gap: 4px;
    }
    .attachment-preview.active { display: flex; }
  </style>
</head>
<body>

  <div class="side-line left"></div>
  <div class="side-line right"></div>
  <div class="fade fade-top"></div>
  <div class="fade fade-bottom"></div>

  <div class="brand"><span id="brand-dot"></span>QwenBot<img id="brand-logo" src="https://yt3.ggpht.com/wkukhDxkd0RNkFVaFWjBtWF1OUPlgYU07M-cFGGqIEYkUj50bxVSI6A-mODHFAEgagjXQ8nHcymQJA=s512-c-fcrop64=1,00000000ffffffff-rw-nd-v1" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'"></div>

  <!-- Settings Menu -->
  <div class="top-controls">
    <button class="settings-btn" id="settings-toggle">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"></path><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
    </button>
    <div class="settings-dropdown" id="settings-dropdown">
      <div class="setting-group">
        <div class="setting-label">AI</div>
        <select id="provider-select">
          <option value="pollinations">Pollinations (free, no key needed)</option>
          <option value="grok">Grok / Groq (API key)</option>
          <option value="llama">Llama 3.2 3B (local, cached, needs GPU)</option>
          <option value="local">Small local model (offline, weak)</option>
        </select>
      </div>

      <div id="grok-settings" style="display:none; flex-direction:column; gap:10px;">
        <a href="https://console.groq.com/keys" target="_blank" rel="noopener noreferrer"
          style="font-size:12px; color:#2563eb; text-decoration:underline; text-align:center;">Groq api key</a>
        <input type="password" id="grok-key" placeholder="API key (xai-... for Grok, gsk_... for Groq)" autocomplete="off" spellcheck="false"

  <script type="module">
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist();
    }

    // The model runs in a Web Worker so loading/generating never blocks the page (no UI lag).
    const WORKER_SRC = `
import { pipeline, env, TextStreamer } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1';
env.useBrowserCache = true;
env.allowLocalModels = true;
let generator = null;
function errText(e) { try { return (e && e.message) ? e.message : String(e); } catch (x) { return 'Unknown error'; } }
self.addEventListener('unhandledrejection', (e) => { self.postMessage({ type: 'error', message: errText(e.reason) }); });
self.onmessage = async (ev) => {
  const d = ev.data;
  try {
    if (d.type === 'load') {
      if (d.fileMap) {
        env.customFetch = (url, opts) => {
          const u = String(url);
          for (const path in d.fileMap) { if (u.endsWith('/' + path)) return fetch(d.fileMap[path]); }
          return fetch(url, opts);
        };
      }
      generator = await pipeline('text-generation', d.model, {
        device: d.device || 'webgpu', dtype: d.dtype,
        progress_callback: (p) => self.postMessage({ type: 'progress', p })
      });
      self.postMessage({ type: 'ready' });
    } else if (d.type === 'generate') {
      const streamer = new TextStreamer(generator.tokenizer, {
        skip_prompt: true, skip_special_tokens: true,
        callback_function: (t) => self.postMessage({ type: 'token', t })
      });
      await generator(d.messages, { max_new_tokens: 2048, do_sample: true, temperature: 0.5, top_p: 0.9, repetition_penalty: 1.05, streamer });
      self.postMessage({ type: 'done' });
    }
  } catch (e) { self.postMessage({ type: 'error', message: errText(e) }); }
};
`;
    let worker = null, modelReady = false, workerHandler = null, rejectPending = null;
    function getWorker() {
      if (!worker) {
        worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' })), { type: 'module' });
        worker.onmessage = (e) => { if (workerHandler) workerHandler(e.data); };
        worker.onerror = (e) => { const err = new Error(e.message || 'Worker failed to start'); err.workerFailed = true; if (rejectPending) rejectPending(err); };
      }
      return worker;
    }
    function workerLoad(model, dtype, fileMap, progress, device) {
      return new Promise((resolve, reject) => {
        const w = getWorker();
        rejectPending = reject;
        workerHandler = (d) => {
          if (d.type === 'progress') { if (progress) progress(d.p); }
          else if (d.type === 'ready') { modelReady = true; rejectPending = null; resolve(); }
          else if (d.type === 'error') { rejectPending = null; reject(new Error(d.message)); }
        };
        w.postMessage({ type: 'load', model, dtype, fileMap, device });
      });
    }
    // Fallback: if the Worker can't start in this setup, run the model on the page itself (works, just less smooth)
    let useMain = false, tf = null, mainGenerator = null;
    async function mainLoad(model, dtype, fileMap, progress, device) {
      tf = tf || await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1');
      tf.env.useBrowserCache = true;
      tf.env.allowLocalModels = true;
      if (fileMap) {
        tf.env.customFetch = (url, opts) => {
          const u = String(url);
          for (const path in fileMap) { if (u.endsWith('/' + path)) return fetch(fileMap[path]); }
          return fetch(url, opts);
        };
      }
      mainGenerator = await tf.pipeline('text-generation', model, { device: device || 'webgpu', dtype, progress_callback: progress });
      modelReady = true;
    }
    async function mainGenerate(messages, onToken) {
      const streamer = new tf.TextStreamer(mainGenerator.tokenizer, { skip_prompt: true, skip_special_tokens: true, callback_function: onToken });
      await mainGenerator(messages, { max_new_tokens: 2048, do_sample: true, temperature: 0.5, top_p: 0.9, repetition_penalty: 1.05, streamer });
    }
    function workerGenerate(messages, onToken) {
      return new Promise((resolve, reject) => {
        rejectPending = reject;
        workerHandler = (d) => {
          if (d.type === 'token') onToken(d.t);
          else if (d.type === 'done') { rejectPending = null; resolve(); }
          else if (d.type === 'error') { rejectPending = null; reject(new Error(d.message)); }
        };
        getWorker().postMessage({ type: 'generate', messages });
      });
    }
    let attachedFile = null;
    let attachedImage = null; // {name, dataUrl}
    let currentChatId = Date.now().toString();
    let chats = {};
    try { chats = JSON.parse(localStorage.getItem('qwen_chats') || '{}') || {}; } catch (e) { chats = {}; }
    function saveChats() {
      try { localStorage.setItem('qwen_chats', JSON.stringify(chats)); } catch (e) { console.warn('Could not save chats:', e); }
    }
    // Every saved message keeps its text, time, and each code block (language + code) separately
    function extractCode(raw) {
      const parts = raw.split('```');
      const out = [];
      for (let i = 1; i < parts.length; i += 2) {
        if (i === parts.length - 1) break; // unclosed block
        const { lang, code } = splitCode(parts[i]);
        out.push({ lang, code });
      }
      return out;
    }
    function saveMessage(role, content, img) {
      const chat = chats[currentChatId];
      if (!chat) return; // the chat was deleted while the reply was still coming in
      const msg = { role, content, time: Date.now() };
      if (img) msg.img = img;
      if (role === 'assistant') { const code = extractCode(content); if (code.length) msg.code = code; }
      chat.messages.push(msg);
      chat.updated = Date.now();
      saveChats();
    }

    const phrases = ["Ready for action...", "What shall we code today?", "Standing by..."];
    document.getElementById('dynamic-hero-text').innerText = phrases[Math.floor(Math.random() * phrases.length)];

    const settingsToggle = document.getElementById('settings-toggle');
    const settingsDropdown = document.getElementById('settings-dropdown');
    const historyToggle = document.getElementById('history-toggle');
    const historyDrawer = document.getElementById('history-drawer');
    const loadModelBtn = document.getElementById('load-model-btn');
    const importFolderBtn = document.getElementById('import-folder-btn');
    const folderInput = document.getElementById('folder-input');
    const statusText = document.getElementById('status-text');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const hero = document.getElementById('hero');
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const attachBtn = document.getElementById('attach-btn');
    const fileInput = document.getElementById('file-input');
    const attachPreview = document.getElementById('attach-preview');
    const attachName = document.getElementById('attach-name');
    const detachBtn = document.getElementById('detach-btn');
    const historyList = document.getElementById('history-list');
    const searchHistory = document.getElementById('search-history');
    const newChatBtn = document.getElementById('new-chat-btn');

    settingsToggle.onclick = () => settingsDropdown.classList.toggle('active');

    // ---------- AI provider: local in-browser models (WebGPU, with automatic CPU fallback) ----------
    const providerSelect = document.getElementById('provider-select');
    const deviceSelect = document.getElementById('device-select');
    let provider = localStorage.getItem('qwen_provider');
    if (provider !== 'llama' && provider !== 'local' && provider !== 'grok' && provider !== 'pollinations') provider = localStorage.getItem('qwen_grok_key') ? 'grok' : 'pollinations'; // default: Grok if you saved an xAI/Groq key in this browser, otherwise Pollinations (no key needed); old 'gemini' setting lands here too
    // Gemini was removed: wipe its leftovers so a saved key doesn't sit in the browser
    ['qwen_gemini_key', 'qwen_gemini_model', 'qwen_gemini_auto'].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
    function isApi() { return provider === 'grok' || provider === 'pollinations'; }

    // ---------- Grok (xAI API): key + model cached in localStorage ----------
    const grokKeyInput = document.getElementById('grok-key');
    const grokModelInput = document.getElementById('grok-model');
    let grokKey = localStorage.getItem('qwen_grok_key') || '';
    let grokModel = localStorage.getItem('qwen_grok_model') || '';
    function grokProvider(key) { return (key || '').startsWith('gsk_') ? 'groq' : 'xai'; }
    function grokDefaultModel(key) { return grokProvider(key) === 'groq' ? 'llama-3.3-70b-versatile' : 'grok-4'; }
    function grokPlaceholder() { return grokProvider(grokKey) === 'xai' ? 'Model (blank = auto-pick best Grok)' : 'Model (blank = auto-pick best Groq model)'; }
    let grokResolved = '';
    // Asks xAI which models this key can use and picks the newest top-tier Grok (cached 24h)
    async function grokAutoModel() {
      const isGroq = grokProvider(grokKey) === 'groq';
      const tag = grokKey.slice(-8);
      try {
        const c = JSON.parse(localStorage.getItem('qwen_grok_auto') || 'null');
        if (c && c.tag === tag && c.model && Date.now() - c.t < 86400000) return c.model;
      } catch (e) {}
      let best = isGroq ? 'llama-3.1-8b-instant' : 'grok-4';
      try {
        const r = await fetch(isGroq ? 'https://api.groq.com/openai/v1/models' : 'https://api.x.ai/v1/models', { headers: { 'Authorization': 'Bearer ' + grokKey } });
        if (r.ok && isGroq) {
          const j = await r.json();
          const badG = /whisper|tts|playai|guard|embed|prompt-guard|safeguard|distil-whisper|orpheus|allam|compound/i;
          const ids = (j.data || []).filter(m => m.active !== false && !badG.test(m.id)).map(m => m.id);
          const pref = ['llama-3.3-70b-versatile', 'openai/gpt-oss-120b', 'openai/gpt-oss-20b', 'meta-llama/llama-4-maverick-17b-128e-instruct', 'qwen/qwen3-32b', 'llama-3.1-8b-instant'];
          const hit = pref.find(x => ids.includes(x));
          if (hit) best = hit;
          else if (ids.length) {
            ids.sort((a, b) => (parseFloat((b.match(/(\d+(?:\.\d+)?)b/i) || [0, 0])[1]) || 0) - (parseFloat((a.match(/(\d+(?:\.\d+)?)b/i) || [0, 0])[1]) || 0));
            best = ids[0];
          }
        } else if (r.ok) {
          const j = await r.json();
          const bad = /image|imagine|vision|video|embed|mini|fast|code|beta|multi-agent|non-reasoning|audio|tts|stt/i;
          const cand = (j.data || []).filter(m => /^grok-\d/.test(m.id) && !bad.test(m.id))
            .map(m => ({ id: m.id, v: parseFloat((m.id.match(/^grok-(\d+(?:\.\d+)?)/) || [0, 0])[1]), created: m.created || 0 }));
          cand.sort((a, b) => b.v - a.v || b.created - a.created);
          if (cand.length) best = cand[0].id;
        }
      } catch (e) {}
      try { localStorage.setItem('qwen_grok_auto', JSON.stringify({ tag, model: best, t: Date.now() })); } catch (e) {}
      return best;
    }
    let groqVisionSkip = [];
    const VISION_RE = /qwen3\.[5-9]|llama-4|scout|maverick|vision|vl\b/i;
    // Picks a vision-capable model from what this Groq key actually lists (Qwen3.6 first, then Llama 4), skipping any that already 404'd
    async function groqVisionModel() {
      if (grokModel && VISION_RE.test(grokModel) && !groqVisionSkip.includes(grokModel)) return grokModel;
      const tag = grokKey.slice(-8);
      try {
        const c = JSON.parse(localStorage.getItem('qwen_groq_vision') || 'null');
        if (c && c.tag === tag && c.model && !groqVisionSkip.includes(c.model) && Date.now() - c.t < 86400000) return c.model;
      } catch (e) {}
      let ids = [];
      try {
        const r = await fetch('https://api.groq.com/openai/v1/models', { headers: { 'Authorization': 'Bearer ' + grokKey } });
        if (r.ok) ids = ((await r.json()).data || []).filter(m => m.active !== false && VISION_RE.test(m.id)).map(m => m.id);
      } catch (e) {}
      ids = ids.filter(x => !groqVisionSkip.includes(x));
      const order = [/qwen3\.6/i, /scout/i, /maverick/i];
      let best = null;
      for (const re of order) { best = ids.find(x => re.test(x)); if (best) break; }
      best = best || ids[0];
      if (!best) throw new Error('Your Groq key has no vision-capable model right now. Try an xAI Grok key for images, or check the models on console.groq.com.');
      try { localStorage.setItem('qwen_groq_vision', JSON.stringify({ tag, model: best, t: Date.now() })); } catch (e) {}
      return best;
    }
    async function resolveGrokModel(vision) {
      if (vision && grokProvider(grokKey) === 'groq') { grokResolved = await groqVisionModel(); updateGrokLabel(); return grokResolved; }
      const stale = grokProvider(grokKey) === 'groq' && /^grok/i.test(grokModel);
      if (!grokModel || stale) grokResolved = await grokAutoModel();
      else grokResolved = grokModel;
      updateGrokLabel();
      return grokResolved;
    }
    function grokEffectiveModel() {
      // a leftover xAI model name (grok-*) is invalid on Groq, so fall back to the Groq default
      if (grokProvider(grokKey) === 'groq' && /^grok/i.test(grokModel)) return grokDefaultModel(grokKey);
      return grokModel || grokDefaultModel(grokKey);
    }
    if (grokProvider(grokKey) === 'groq' && /^grok/i.test(grokModel)) { grokModel = ''; try { localStorage.removeItem('qwen_grok_model'); } catch (e) {} }
    grokKeyInput.value = grokKey;
    grokModelInput.value = grokModel;
    grokModelInput.placeholder = grokPlaceholder();
    function saveGrok() {
      grokKey = grokKeyInput.value.trim();
      grokModel = grokModelInput.value.trim();
      try {
        localStorage.setItem('qwen_grok_key', grokKey);
        localStorage.setItem('qwen_grok_model', grokModel);
      } catch (e) {}
      grokModelInput.placeholder = grokPlaceholder();
      statusText.innerText = grokKey ? ('Key saved and cached (' + (grokProvider(grokKey) === 'groq' ? 'Groq' : 'xAI Grok') + ').') : 'No key saved.';
      updateGrokLabel();
    }
    function updateGrokLabel() {
      if (provider === 'grok') document.getElementById('model-label').innerText = (grokResolved || grokEffectiveModel()) + ' (' + (grokProvider(grokKey) === 'groq' ? 'Groq' : 'xAI') + ' API)' + (grokKey ? '' : ' - add a key');
    }
    document.getElementById('grok-save-btn').onclick = saveGrok;
    grokKeyInput.addEventListener('change', saveGrok);
    grokModelInput.addEventListener('change', saveGrok);
    document.getElementById('grok-upload-btn').onclick = () => document.getElementById('grok-file').click();
    document.getElementById('grok-file').onchange = async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const txt = await f.text();
      const m = txt.match(/(?:xai-|gsk_)[A-Za-z0-9_\-]+/);
      grokKeyInput.value = (m ? m[0] : txt.trim().split(/\s+/)[0] || '');
      e.target.value = '';
      saveGrok();
    };
    document.getElementById('grok-clear-btn').onclick = () => {
      grokKeyInput.value = '';
      try { localStorage.removeItem('qwen_grok_key'); } catch (e) {}
      saveGrok();
    };
    // Quietly asks the API for a short topic/subject and uses it as the chat's name in History.

    // ---------- Pollinations: free, works for visitors with no sign-in and no key ----------
    // OWNER: paste ONE Pollinations *publishable* key (pk_...) from https://enter.pollinations.ai here.
    // pk_ keys are made for browser pages, and Pollinations counts their limits per visitor IP, so one
    // key does NOT pool everyone's requests together. NEVER paste a secret key (sk_...) here: anyone can read this file.
    const POLLINATIONS_OWNER_KEY = '';
    const pollKeyInput = document.getElementById('poll-key');
    const pollModelInput = document.getElementById('poll-model');
    let pollKey = localStorage.getItem('qwen_poll_key') || '';
    let pollModel = localStorage.getItem('qwen_poll_model') || '';
    pollKeyInput.value = pollKey;
    pollModelInput.value = pollModel;
    const sleepMs = (ms) => new Promise(r => setTimeout(r, ms));
    function pollActiveKey() { return pollKey || POLLINATIONS_OWNER_KEY; }
    let pollUsed = '';
    function updatePollLabel() {
      if (provider !== 'pollinations') return;
      const fell = pollModel && pollUsed && pollUsed !== pollModel;
      document.getElementById('model-label').innerText = (pollUsed || pollModel || 'openai') + ' (Pollinations' + (pollActiveKey() ? '' : ', free') + ')' + (fell ? ' - "' + pollModel + '" was refused, fell back' : '');
    }
    // Model list: chat models plus image models. A model that can make images gets an "Image generation" badge on the right.
    // Click a chat model = use it for chat. Click a model with the badge = it also becomes the image maker.
    // An image-only model just becomes the image maker (chat keeps using your chat model).
    let pollImgModel = localStorage.getItem('qwen_poll_img_model') || '';
    let pollRows = [];
    const pollListEl = document.getElementById('poll-model-list');
    function hasMod(m, what) { const a = m && (m.output_modalities || m.outputModalities); return Array.isArray(a) && a.includes(what); }
    function renderPollList() {
      pollListEl.textContent = '';
      pollRows.forEach(row => {
        const el = document.createElement('div');
        el.className = 'pm-row' + ((row.id === pollModel || row.id === pollImgModel) ? ' sel' : '');
        const name = document.createElement('span');
        name.className = 'pm-name';
        name.textContent = row.id;
        el.appendChild(name);
        if (row.image) {
          const b = document.createElement('span');
          b.className = 'pm-badge';
          b.textContent = row.chat ? 'Image generation' : 'Image only';
          el.appendChild(b);
        }
        el.onclick = () => {
          if (row.chat) { pollModelInput.value = row.id; pollUsed = ''; }
          if (row.image) { pollImgModel = row.id; try { localStorage.setItem('qwen_poll_img_model', pollImgModel); } catch (e) {} }
          savePoll();
          renderPollList();
          statusText.innerText = (row.chat ? 'Chat model: ' + row.id + '. ' : '') + (row.image ? 'Image maker: ' + row.id + '.' : '');
        };
        pollListEl.appendChild(el);

    let gpuInfo = '';

    async function getGpuAdapter() {

      // runtime try WebGPU itself (that is what the simple version of this page did), and only then fall back to CPU.

      for (let n = 0; n < attempts.length; n++) {

              Math.round(adapter.limits.maxStorageBufferBindingSize / 1048576) + 'MB | f16 ' + adapter.features.has('shader-f16')

        } else {

          if (at.main) {

            await mainLoad(MODEL_ID, dtype, fileMap, progress_callback, at.device);
          } else {
            useMain = false;
            try {
              await workerLoad(MODEL_ID, dtype, fileMap, progress_callback, at.device);
            } catch (we) {

              if (worker) { worker.terminate(); worker = null; }

              await mainLoad(MODEL_ID, dtype, fileMap, progress_callback, at.device);
            }

          loadedIdx = modelIdx;
          activeDevice = at.device;

        } catch (e) {

          const msg = String((e && e.message) || e);

            n = attempts.findIndex(x => x.device === 'wasm') - 1;

    function buildHistory() {
      const msgs = chats[currentChatId].messages;
      if (!isApi()) return msgs.slice(-12).map(m => ({ role: m.role, content: m.content }));
      const out = []; let used = 0;
      for (let i = msgs.length - 1; i >= 0 && out.length < 500; i--) {

        if (out.length && used + len > 20000) break;

        out.unshift({ role: msgs[i].role, content: msgs[i].content, i });

          if (stickToBottom) chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        if (shown < raw.length) { rafPending = true; requestAnimationFrame(pump); }

            let node = null;
            if (i % 2 === 0) { const t = proseText(parts, i); if (t) node = formatInline(t); }
            else { const { lang, code } = splitCode(parts[i]); node = IMG_LANG.test(lang) ? makeImageBox(code).box : makeCodeBox(lang, code, false).box; }
            if (live && live.idx === i) { if (node) live.root.replaceWith(node); else live.root.remove(); live = null; }
            else if (node) el.appendChild(node);
          }
          done = Math.max(done, stable);
          if (final) return;
          const i = parts.length - 1;
          if (!live || live.idx !== i) {
            if (i % 2 === 0) live = { idx: i, root: document.createElement('span'), len: 0 };
            else { const b = makeCodeBox('code', '', true); live = { idx: i, root: b.box, label: b.label, codeEl: b.codeEl, len: 0 }; }
            el.appendChild(live.root);
          }
          if (i % 2 === 0) {
            const t = i > 0 ? parts[i].replace(/^\n/, '') : parts[i];
            if (t.length !== live.len) { live.root.textContent = ''; live.root.appendChild(formatInline(t)); }
            live.len = t.length;
          } else {
            const { lang, code } = splitCode(parts[i]);
            live.label.textContent = lang;
            fadeAppend(live.codeEl, code.slice(live.len));
            live.len = code.length;
          }
        }
      };
    }

    function renderRich(el, text) { createStreamRenderer(el).update(text, true); }

    let stickToBottom = true;
    chatContainer.addEventListener('scroll', () => {
      stickToBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 80;
    });

    function addCopyBar(div, text, instant) {
      const bar = document.createElement('div');
      bar.className = 'msg-actions show' + (instant ? ' static' : '');
      const btn = document.createElement('button');
      btn.className = 'code-btn';
      btn.title = 'Copy';
      btn.innerHTML = COPY_ICON;
      btn.onclick = async () => {
        try { await navigator.clipboard.writeText(text); } catch (e) {
          const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        }
        btn.innerHTML = CHECK_ICON;
        setTimeout(() => { btn.innerHTML = COPY_ICON; }, 1200);
      };
      bar.appendChild(btn);
      div.after(bar);
    }

    function appendMsg(role, text, img) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      if (role === 'assistant') { renderRich(div, text); if (text) div.classList.add('done', 'static'); } else div.innerText = text;
      if (role === 'user' && img) { const im = document.createElement('img'); im.className = 'user-img'; im.src = img; div.prepend(im); }
      chatContainer.appendChild(div);
      if (role === 'assistant' && text) addCopyBar(div, text, true);
      if (role === 'user') stickToBottom = true;
      if (stickToBottom) chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    // Status dot: grey while the AI is loading or answering, blue when it is ready / finished.
    // Shown next to "QwenBot" on the page and as the little icon on the browser tab.
    let dotBusy = false, dotLast = '';
    function setBusy(v) { dotBusy = v; refreshDot(); }
    document.addEventListener('visibilitychange', () => refreshDot());
    const brandDot = document.getElementById('brand-dot');
    const favLink = document.createElement('link');
    favLink.rel = 'icon';
    document.head.appendChild(favLink);
    function refreshDot() {
      let ready = false;
      try { ready = modelMatchesProvider(); } catch (e) {}
      const state = (!dotBusy && ready) ? 'blue' : 'grey';
      if (state === dotLast) return;
      dotLast = state;
      brandDot.classList.toggle('ready', state === 'blue');
      try {
        const c = document.createElement('canvas');
        c.width = c.height = 64;
        const g = c.getContext('2d');
        g.fillStyle = state === 'blue' ? '#3b82f6' : '#9ca3af';
        g.beginPath(); g.arc(32, 32, 24, 0, Math.PI * 2); g.fill();
        favLink.type = 'image/png';
        favLink.href = c.toDataURL('image/png');
      } catch (e) {}
    }
    refreshDot();
    setInterval(refreshDot, 400);

    document.querySelector('.input-pill').addEventListener('click', (e) => {
      if (!e.target.closest('button, #detach-btn')) userInput.focus();
    });

    sendBtn.onclick = handleSend;
    userInput.onkeypress = (e) => { if (e.key === 'Enter') handleSend(); };

    // If this model is already in the browser cache, load it automatically (no download button needed)
    async function autoLoadIfCached() {
      try {
        if (!window.caches) return;
        const adapter = await getGpuAdapter();
        const hasGpu = gpuAllowed();
        const f16 = adapter ? adapter.features.has('shader-f16') : true;
        let urls = [];
        for (const name of await caches.keys()) {
          const c = await caches.open(name);
          urls = urls.concat((await c.keys()).map(r => r.url));
        }
        for (let i = 0; i < MODELS.length; i++) {
          if (provider === 'llama') { if (i !== llamaIdx) continue; }
          else if (i === llamaIdx || (hasGpu ? failedModels.includes(i) : i !== cpuModelIdx)) continue;
          const dtype = (!hasGpu || (MODELS[i].dtype === 'q4f16' && !f16)) ? 'q4' : MODELS[i].dtype;
          if (urls.some(u => u.includes('/' + MODELS[i].id + '/') && u.includes('model_' + dtype + '.onnx'))) {
            setModel(i);
            statusText.innerText = 'Found cached model, loading...';
            loadModelBtn.click();
            return;
          }
        }
      } catch (e) { console.warn('Cache check failed:', e); }
    }
    if (provider === 'llama') setModel(llamaIdx);
    applyProvider();
    if (!isApi()) autoLoadIfCached();

    renderHistory();
  </script>
</body>
</html>
