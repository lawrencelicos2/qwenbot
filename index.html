<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QwenBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    button, input, select, textarea { font-family: inherit; }
    body {
      font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background-color: #ffffff;
      color: #1f2937;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Side Lines - Inset 15% top/bottom, tight to scrollbar */
    .side-line {
      position: absolute;
      top: 15%;
      bottom: 15%;
      width: 3px;
      background-color: #e5e7eb;
      z-index: 5;
    }
    .side-line.left { left: max(4px, calc(50% - 372px)); }
    .side-line.right { left: min(calc(100% - 7px), calc(50% + 369px)); }

    /* Top-left brand */
    .brand {
      position: absolute;
      top: 14px;
      left: 24px;
      z-index: 20;
      font-weight: 700;
      font-size: 53px;
      letter-spacing: -0.8px;
      color: #333333;
      transform: scaleY(0.96);
      transform-origin: left center;
      pointer-events: none;
      user-select: none;
    }

    /* Top Utility Controls */
    .top-controls {
      position: absolute;
      top: 20px;
      right: 24px;
      z-index: 20;
    }
    .settings-btn {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #e5e7eb;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #4b5563;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .settings-btn:hover { background: rgba(243, 244, 246, 0.9); }

    .settings-dropdown {
      position: absolute;
      top: 50px;
      right: 0;
      width: 320px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 30;
      font-size: 13px;
    }
    .settings-dropdown.active { display: flex; }

    .setting-group { display: flex; flex-direction: column; gap: 6px; }
    .setting-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      color: #374151;
      font-size: 12px;
      outline: none;
    }
    .setting-hint { font-size: 11px; color: #6b7280; line-height: 1.4; }
    .setting-hint a { color: #374151; }
    .setting-label { font-weight: 600; color: #6b7280; font-size: 11px; text-transform: uppercase; }

    select, button.action-btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      color: #374151;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    button.action-btn { background: #f3f4f6; font-weight: 500; transition: background 0.15s; text-align: center; }
    button.action-btn:hover { background: #e5e7eb; }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #f3f4f6;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
      display: none;
    }
    .progress-bar { height: 100%; width: 0%; background: #9ca3af; transition: width 0.1s linear; }

    /* Centered Hero View */
    .hero-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .hero-logo {
      font-weight: 600;
      font-size: 44px;
      letter-spacing: -0.5px;
      color: #4b5563;
      transform: scaleY(0.95);
      margin-bottom: 12px;
    }
    .hero-text {
      font-size: 18px;
      color: #6b7280;
      font-weight: 400;
      text-align: center;
    }

    /* Main Chat Stream Container */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 40px 20px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      display: none;
      flex-direction: column;
      gap: 20px;
    }
    .chat-container.active { display: flex; }

    .msg {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      max-width: 85%;
      flex-shrink: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .fade-in { animation: fadeIn 0.5s ease-out both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .msg { contain: layout style; }

    /* Code blocks */
    .codebox {
      border: 1px solid #d1d5db;
      border-radius: 12px;
      margin: 10px 0;
      overflow: hidden;
      background: #fafafa;
      width: 100%;
    }
    .code-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px 6px 14px;
      border-bottom: 1px solid #e5e7eb;
      background: #f3f4f6;
    }
    .code-lang { font-weight: 700; font-size: 12px; color: #4b5563; }
    .code-actions { display: flex; gap: 2px; }
    .code-btn {
      background: transparent;
      border: none;
      color: #6b7280;
      cursor: pointer;
      padding: 5px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .code-btn:hover { background: #e5e7eb; color: #111827; }
    .codebox pre {
      margin: 0;
      padding: 12px 14px;
      overflow-x: auto;
      white-space: pre;
    }
    .codebox code {
      color: #15803d;
      font-size: 13px;
      line-height: 1.5;
    }

    /* White edge fades (above chat/lines/scrollbar, below buttons) */
    .fade { position: fixed; left: 0; right: 0; pointer-events: none; z-index: 10; }
    .fade-top { top: 0; height: 90px; background: linear-gradient(to bottom, #ffffff 25%, rgba(255,255,255,0) 100%); }
    .fade-bottom { bottom: 0; height: 130px; background: linear-gradient(to top, #ffffff 30%, rgba(255,255,255,0) 100%); }
    .bottom-area { z-index: 15; }

    /* Syntax colors (base code color = green = variables) */
    .codebox code .tk-ctrl  { color: #7c3aed; }
    .codebox code .tk-decl  { color: #4f46e5; }
    .codebox code .tk-const { color: #c2410c; }
    .codebox code .tk-logic { color: #be123c; }
    .codebox code .tk-str   { color: #b45309; }
    .codebox code .tk-num   { color: #1d4ed8; }
    .codebox code .tk-com   { color: #9ca3af; font-style: italic; }
    .codebox code .tk-fn    { color: #0e7490; }
    .codebox code .tk-type  { color: #0369a1; }
    .codebox code .tk-op    { color: #4b5563; }
    .codebox code .tk-tag   { color: #be123c; }

    .msg.user { align-self: flex-end; background: #f3f4f6; color: #1f2937; }
    .msg.assistant { align-self: flex-start; background: transparent; color: #1f2937; border: 1px solid transparent; position: relative; }
    .msg.assistant .codebox { background: #ffffff; }
    .msg.assistant strong { font-weight: 700; }
    .msg.assistant em { font-style: italic; }
    .msg.assistant mark { background: #fef08a; color: inherit; padding: 0 3px; border-radius: 3px; }
    .msg.assistant .inline-code { font-family: 'Roboto Mono', monospace; font-size: 0.9em; background: #f3f4f6; padding: 1px 5px; border-radius: 4px; }
    /* When the reply finishes: outline draws first, then the grey fill drops down like a curtain behind a matte black CRT line */
    .msg.assistant.done { border-color: #e5e7eb; transition: border-color 0.4s ease; }
    .msg.assistant.done::before {
      content: ''; position: absolute; inset: -1px; border-radius: 12px; background: #f9fafb; z-index: -1;
      clip-path: inset(0 0 100% 0);
      animation: crtFill 0.7s linear 0.4s forwards;
    }
    .msg.assistant.done::after {
      content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; z-index: 1; opacity: 0; pointer-events: none;
      background: #000;
      animation: crtScan 0.7s linear 0.4s forwards;
    }
    @keyframes crtFill { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes crtScan { 0% { top: 0; opacity: 1; } 90% { opacity: 1; } 100% { top: calc(100% - 2px); opacity: 0; } }
    .msg.assistant.static::before { animation: none; clip-path: inset(0 0 0 0); }
    .msg.assistant.static::after { display: none; }

    /* Copy button under the AI bubble: fades in right after the curtain fill finishes (0.4s + 0.7s) */
    .msg-actions { align-self: flex-start; display: flex; margin: -14px 0 0 6px; opacity: 0; flex-shrink: 0; }
    .msg-actions.show { animation: fadeIn 0.5s ease-out 1.1s forwards; }
    .msg-actions.show.static { animation: none; opacity: 1; }

    /* Bottom Floating Area with Pill */
    .bottom-area {
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .input-pill {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #e5e7eb;
      border-radius: 30px;
      padding: 6px 10px 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 220px;
      max-width: 90%;
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      cursor: text;
    }
    .input-pill:hover, .input-pill:focus-within {
      width: 40%;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 50%;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .pill-btn:hover { color: #4b5563; }

    .input-pill input[type="text"] {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 13px;
      color: #1f2937;
      min-width: 0;
    }

    .send-btn { background: #e5e7eb; color: #4b5563; }
    .send-btn:hover { background: #d1d5db; color: #111827; }

    /* Bottom-Left Drawer */
    .history-toggle {
      position: absolute;
      bottom: 20px;
      left: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #4b5563;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      z-index: 20;
    }

    .history-drawer {
      position: absolute;
      bottom: 70px;
      left: 24px;
      width: 280px;
      height: 380px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 30;
    }
    .history-drawer.active { display: flex; }

    .search-input {
      flex-shrink: 0;
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      font-size: 12px;
      outline: none;
    }
    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .history-item {
      flex-shrink: 0;
      min-height: 34px;
      line-height: 1.4;
      padding: 9px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #4b5563;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-item:hover { background: #f3f4f6; color: #111827; }

    .attachment-preview {
      display: none;
      font-size: 11px;
      background: #f3f4f6;
      color: #4b5563;
      padding: 2px 8px;
      border-radius: 10px;
      align-items: center;
      gap: 4px;
    }
    .attachment-preview.active { display: flex; }
  </style>
</head>
<body>

  <div class="side-line left"></div>
  <div class="side-line right"></div>
  <div class="fade fade-top"></div>
  <div class="fade fade-bottom"></div>

  <div class="brand">QwenBot</div>

  <!-- Settings Menu -->
  <div class="top-controls">
    <button class="settings-btn" id="settings-toggle">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"></path><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
    </button>
    <div class="settings-dropdown" id="settings-dropdown">
      <div class="setting-group">
        <div class="setting-label">AI</div>
        <select id="provider-select">
          <option value="llama">Llama 3.2 3B (local, cached, needs GPU)</option>
          <option value="local">Small local model (offline, weak)</option>
          <option value="grok">Grok / Groq (API key)</option>
        </select>
      </div>

      <div id="grok-settings" style="display:none; flex-direction:column; gap:10px;">
        <a href="https://console.groq.com/keys" target="_blank" rel="noopener noreferrer"
          style="font-size:12px; color:#2563eb; text-decoration:underline; text-align:center;">Groq api key</a>
        <input type="password" id="grok-key" placeholder="API key (xai-... for Grok, gsk_... for Groq)" autocomplete="off" spellcheck="false"
          style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid #d1d5db; font-size:12px; box-sizing:border-box;">
        <input type="text" id="grok-model" placeholder="Model (blank = auto for your key)" spellcheck="false"
          style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid #d1d5db; font-size:12px; box-sizing:border-box;">
        <button class="action-btn" id="grok-save-btn">Save & Cache Key</button>
        <button class="action-btn" id="grok-upload-btn">Upload Key File</button>
        <button class="action-btn" id="grok-clear-btn">Clear Saved Key</button>
        <input type="file" id="grok-file" accept=".txt,.key,.json,text/plain" style="display:none">
      </div>

      <div class="setting-group" id="device-group">
        <div class="setting-label">Run on</div>
        <select id="device-select">
          <option value="auto">Auto (WebGPU, falls back to CPU)</option>
          <option value="cpu">CPU only (WASM)</option>
        </select>
      </div>

      <div id="local-settings" style="display:flex; flex-direction:column; gap:12px;">
      <div id="model-label" style="font-size:11px; color:#6b7280; text-align:center; margin-bottom:8px;"></div>

      <button class="action-btn" id="load-model-btn">Download & Cache Model</button>
      <button class="action-btn" id="import-folder-btn">Import Model Folder</button>
      <button class="action-btn" id="export-model-btn">Export Cached Model to Folder</button>
      <input type="file" id="folder-input" webkitdirectory directory multiple style="display:none">

      <div class="progress-bar-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      </div>
      <button class="action-btn" id="gpu-test-btn">Test GPU</button>
      <div id="status-text" style="font-size:11px; color:#6b7280; text-align:center; white-space:pre-line; word-break:break-word;">Status: Idle</div>
    </div>
  </div>

  <!-- Hero Content -->
  <div class="hero-container" id="hero">
    <div class="hero-logo">Qwen</div>
    <div class="hero-text" id="dynamic-hero-text">Ready for action...</div>
  </div>

  <!-- Chat Area -->
  <div class="chat-container" id="chat-container"></div>

  <!-- Bottom Floating Pill Area -->
  <div class="bottom-area">
    <div class="input-pill">
      <button class="pill-btn" id="attach-btn" title="Attach file">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"></path></svg>
      </button>
      <input type="file" id="file-input" style="display:none">
      <div class="attachment-preview" id="attach-preview">
        <span id="attach-name">file</span>
        <span style="cursor:pointer" id="detach-btn">&times;</span>
      </div>
      <input type="text" id="user-input" placeholder="Ask Qwen..." autocomplete="off">
      <button class="pill-btn send-btn" id="send-btn">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
      </button>
    </div>
  </div>

  <!-- History Menu -->
  <button class="history-toggle" id="history-toggle">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
  </button>

  <div class="history-drawer" id="history-drawer">
    <input type="text" class="search-input" id="search-history" placeholder="Search chats...">
    <div class="history-list" id="history-list"></div>
    <button class="action-btn" id="new-chat-btn">+ New Chat</button>
  </div>

  <script type="module">
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist();
    }

    // The model runs in a Web Worker so loading/generating never blocks the page (no UI lag).
    const WORKER_SRC = `
import { pipeline, env, TextStreamer } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1';
env.useBrowserCache = true;
env.allowLocalModels = true;
let generator = null;
function errText(e) { try { return (e && e.message) ? e.message : String(e); } catch (x) { return 'Unknown error'; } }
self.addEventListener('unhandledrejection', (e) => { self.postMessage({ type: 'error', message: errText(e.reason) }); });
self.onmessage = async (ev) => {
  const d = ev.data;
  try {
    if (d.type === 'load') {
      if (d.fileMap) {
        env.customFetch = (url, opts) => {
          const u = String(url);
          for (const path in d.fileMap) { if (u.endsWith('/' + path)) return fetch(d.fileMap[path]); }
          return fetch(url, opts);
        };
      }
      generator = await pipeline('text-generation', d.model, {
        device: d.device || 'webgpu', dtype: d.dtype,
        progress_callback: (p) => self.postMessage({ type: 'progress', p })
      });
      self.postMessage({ type: 'ready' });
    } else if (d.type === 'generate') {
      const streamer = new TextStreamer(generator.tokenizer, {
        skip_prompt: true, skip_special_tokens: true,
        callback_function: (t) => self.postMessage({ type: 'token', t })
      });
      await generator(d.messages, { max_new_tokens: 2048, do_sample: true, temperature: 0.5, top_p: 0.9, repetition_penalty: 1.05, streamer });
      self.postMessage({ type: 'done' });
    }
  } catch (e) { self.postMessage({ type: 'error', message: errText(e) }); }
};
`;
    let worker = null, modelReady = false, workerHandler = null, rejectPending = null;
    function getWorker() {
      if (!worker) {
        worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' })), { type: 'module' });
        worker.onmessage = (e) => { if (workerHandler) workerHandler(e.data); };
        worker.onerror = (e) => { const err = new Error(e.message || 'Worker failed to start'); err.workerFailed = true; if (rejectPending) rejectPending(err); };
      }
      return worker;
    }
    function workerLoad(model, dtype, fileMap, progress, device) {
      return new Promise((resolve, reject) => {
        const w = getWorker();
        rejectPending = reject;
        workerHandler = (d) => {
          if (d.type === 'progress') { if (progress) progress(d.p); }
          else if (d.type === 'ready') { modelReady = true; rejectPending = null; resolve(); }
          else if (d.type === 'error') { rejectPending = null; reject(new Error(d.message)); }
        };
        w.postMessage({ type: 'load', model, dtype, fileMap, device });
      });
    }
    // Fallback: if the Worker can't start in this setup, run the model on the page itself (works, just less smooth)
    let useMain = false, tf = null, mainGenerator = null;
    async function mainLoad(model, dtype, fileMap, progress, device) {
      tf = tf || await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1');
      tf.env.useBrowserCache = true;
      tf.env.allowLocalModels = true;
      if (fileMap) {
        tf.env.customFetch = (url, opts) => {
          const u = String(url);
          for (const path in fileMap) { if (u.endsWith('/' + path)) return fetch(fileMap[path]); }
          return fetch(url, opts);
        };
      }

    async function grokGenerate(messages, onTok) {

        const idx = loadedIdx >= 0 ? loadedIdx : modelIdx;
        const want = '/' + MODELS[idx].id + '/';
        const found = [];
        for (const name of await caches.keys()) {
          const c = await caches.open(name);
          for (const r of await c.keys()) if (r.url.includes(want)) found.push({ c, r });
        }
        if (!found.length) throw new Error('Nothing cached for ' + MODELS[idx].name + ' yet. Load the model first.');
        let root = null;
        if (window.showDirectoryPicker) {
          statusText.innerText = 'Pick an empty folder to save the model into...';

        }
        let n = 0;
        for (const { c, r } of found) {
          n++;
          statusText.innerText = 'Saving file ' + n + ' of ' + found.length + '...';
          const resp = await c.match(r);
          const tail = r.url.split('?')[0];
          const rel = tail.includes('/resolve/') ? tail.split('/resolve/')[1].split('/').slice(1).join('/') : tail.split('/').pop();

            let d = root;

            document.body.appendChild(a); a.click(); a.remove();

      const drained = new Promise((r) => { resolveDrain = r; });

          else if (useMain) await mainGenerate(convo, onTok);
          else await workerGenerate(convo, onTok);
        } finally { clearTimeout(timer); }
      }
      let convo;

    const COPY_ICON = '<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 012-2h9"></path></svg>';
    const CHECK_ICON = '<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"></path></svg>';
    const DOWNLOAD_ICON = '<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 4v10M7.5 10L12 14.5 16.5 10M5 20h14"></path></svg>';
    const EXTENSIONS = { html: 'html', css: 'css', javascript: 'js', js: 'js', typescript: 'ts', ts: 'ts', python: 'py', py: 'py', json: 'json', bash: 'sh', shell: 'sh', sh: 'sh', markdown: 'md', md: 'md', java: 'java', c: 'c', cpp: 'cpp', csharp: 'cs', go: 'go', rust: 'rs', php: 'php', ruby: 'rb', sql: 'sql', xml: 'xml', yaml: 'yml' };


    // ---------- Syntax highlighting ----------
    const HL = {
      ctrl: new Set('if else elif for while do switch case default break continue return try except catch finally throw throws raise yield await async with match goto'.split(' ')),
      bashCtrl: new Set('then fi esac done'.split(' ')),
      decl: new Set('def class function let const var import from export as new fn struct enum interface impl trait package namespace using public private protected static final abstract extends implements lambda del global nonlocal module require typedef extern func type'.split(' ')),

      types: new Set('int float double char str string bool boolean void long short byte list dict set tuple number object any'.split(' '))

    function hlSpan(parent, text, cls) {
      if (!text) return;
      if (!cls) { parent.appendChild(document.createTextNode(text)); return; }
      const sp = document.createElement('span');
      sp.className = 'tk-' + cls;
      sp.textContent = text;
      parent.appendChild(sp);

    function tokenizeCode(code, lang, parent) {
      const hashComments = ['python', 'py', 'bash', 'sh', 'shell', 'yaml', 'yml', 'ruby', 'rb', 'r', 'toml'].includes(lang);
      const comment = hashComments ? '#[^\\n]*' : (lang === 'sql' ? '--[^\\n]*|/\\*[\\s\\S]*?(?:\\*/|$)' : '//[^\\n]*|/\\*[\\s\\S]*?(?:\\*/|$)');
      const str = '"""[\\s\\S]*?(?:"""|$)|\'\'\'[\\s\\S]*?(?:\'\'\'|$)|"(?:\\\\.|[^"\\\\\\n])*"?|\'(?:\\\\.|[^\'\\\\\\n])*\'?|`(?:\\\\[\\s\\S]|[^`\\\\])*`?';

        const t = m[0];
        let cls = null;
        if (m[1]) cls = 'com';
        else if (m[2]) {
          cls = 'str';
          if (lang === 'json' && /^\s*:/.test(code.slice(m.index + t.length, m.index + t.length + 20))) cls = 'type';
        }
        else if (m[3]) cls = 'num';
        else if (m[4]) {
          const gap = code.slice(prevEnd, m.index);
          const before = /^\s*$/.test(gap) ? prevWord : '';
          if (isBash && HL.bashCtrl.has(t)) cls = 'ctrl';
          else if (HL.ctrl.has(t)) cls = 'ctrl';
          else if (HL.decl.has(t)) cls = 'decl';
          else if (HL.logic.has(t)) cls = 'logic';
          else if (HL.consts.has(t)) cls = 'const';
          else if (HL.types.has(t)) cls = 'type';
          else if (code[m.index + t.length] === '(') cls = 'fn';

        else if (m[6]) cls = 'op';

        last = m.index + t.length;
        if (t.length === 0) re.lastIndex++;

    function highlightCSS(code, parent) {
      let i = 0, depth = 0, expectProp = true;
      const n = code.length;
      const tokRe = /("(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(#[0-9a-fA-F]{3,8}\b)|(-?\d*\.?\d+(?:%|[a-zA-Z]+)?)|([A-Za-z_-][\w-]*)|(;)/g;
      while (i < n) {
        if (code.startsWith('/*', i)) {
          let end = code.indexOf('*/', i + 2); end = end === -1 ? n : end + 2;
          hlSpan(parent, code.slice(i, end), 'com'); i = end; continue;
        }
        const ch = code[i];
        if (ch === '{') { depth++; expectProp = true; hlSpan(parent, ch, null); i++; continue; }
        if (ch === '}') { depth = Math.max(0, depth - 1); hlSpan(parent, ch, null); i++; continue; }
        let j = i;
        while (j < n && code[j] !== '{' && code[j] !== '}' && !code.startsWith('/*', j)) j++;

        if (depth === 0) { hlSpan(parent, seg, /\S/.test(seg) ? 'tag' : null); }
        else {

          let last = 0, m;
          while ((m = tokRe.exec(seg))) {
            if (m.index > last) hlSpan(parent, seg.slice(last, m.index), null);
            let cls = null;
            if (m[1]) cls = 'str';
            else if (m[2]) cls = 'const';
            else if (m[3]) cls = 'num';
            else if (m[4]) {

    function htmlMarkup(text, parent) {

        let cls = null;
        if (m[1]) cls = 'com';
        else if (m[2]) cls = 'decl';
        else if (m[3]) { cls = 'tag'; inTag = true; }
        else if (m[4]) { cls = 'tag'; inTag = false; }
        else if (m[5]) cls = inTag ? 'type' : null;
        else if (m[6]) cls = inTag ? 'str' : null;

    function makeCodeBox(lang, code, live) {

    // Safe inline formatting: **bold**, *italic*, ==highlight==, `code`, and <b>/<i>/<mark> tags.
    // Everything is built with createElement/textContent, so model output can never inject real HTML.
    function formatInline(text, depth) {

      const re = /\*\*(?=\S)([^\n]+?)(?<=\S)\*\*|==(?=\S)([^\n]+?)(?<=\S)==|(?<![\w*])\*(?=[^\s*])([^*\n]+?)(?<=[^\s*])\*(?![\w*])|`([^`\n]+)`|<(b|strong)>([\s\S]*?)<\/\5>|<(i|em)>([\s\S]*?)<\/\7>|<mark>([\s\S]*?)<\/mark>/gi;

        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));

        else if (m[2] !== undefined) add('mark', m[2]);
        else if (m[3] !== undefined) add('em', m[3]);
        else if (m[4] !== undefined) add('span', m[4], 'inline-code', true);
        else if (m[6] !== undefined) add('strong', m[6]);

    // Only the newest part of a message is touched while streaming (new text fades in);

    function createStreamRenderer(el) {

        let t = parts[i];

        if (!text) return;

        sp.className = 'fade-in';
        sp.textContent = text;
        target.appendChild(sp);

        update(raw, final) {
          const parts = raw.split('```');

            if (i % 2 === 0) { const t = proseText(parts, i); if (t) node = formatInline(t); }
            else { const { lang, code } = splitCode(parts[i]); node = makeCodeBox(lang, code, false).box; }
            if (live && live.idx === i) { if (node) live.root.replaceWith(node); else live.root.remove(); live = null; }
            else if (node) el.appendChild(node);
          }
          done = Math.max(done, stable);
          if (final) return;
          const i = parts.length - 1;
          if (!live || live.idx !== i) {
            if (i % 2 === 0) live = { idx: i, root: document.createElement('span'), len: 0 };
            else { const b = makeCodeBox('code', '', true); live = { idx: i, root: b.box, label: b.label, codeEl: b.codeEl, len: 0 }; }
            el.appendChild(live.root);
          }
          if (i % 2 === 0) {
            const t = i > 0 ? parts[i].replace(/^\n/, '') : parts[i];
            if (t.length !== live.len) { live.root.textContent = ''; live.root.appendChild(formatInline(t)); }
            live.len = t.length;
          } else {
            const { lang, code } = splitCode(parts[i]);
            live.label.textContent = lang;
            fadeAppend(live.codeEl, code.slice(live.len));
            live.len = code.length;
          }
        }
      };
    }

    function renderRich(el, text) { createStreamRenderer(el).update(text, true); }

    let stickToBottom = true;
    chatContainer.addEventListener('scroll', () => {
      stickToBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 80;
    });

    function addCopyBar(div, text, instant) {
      const bar = document.createElement('div');
      bar.className = 'msg-actions show' + (instant ? ' static' : '');
      const btn = document.createElement('button');
      btn.className = 'code-btn';
      btn.title = 'Copy';
      btn.innerHTML = COPY_ICON;
      btn.onclick = async () => {
        try { await navigator.clipboard.writeText(text); } catch (e) {
          const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        }
        btn.innerHTML = CHECK_ICON;
        setTimeout(() => { btn.innerHTML = COPY_ICON; }, 1200);
      };
      bar.appendChild(btn);
      div.after(bar);
    }

    function appendMsg(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      if (role === 'assistant') { renderRich(div, text); if (text) div.classList.add('done', 'static'); } else div.innerText = text;
      chatContainer.appendChild(div);
      if (role === 'assistant' && text) addCopyBar(div, text, true);
      if (role === 'user') stickToBottom = true;
      if (stickToBottom) chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    document.querySelector('.input-pill').addEventListener('click', (e) => {
      if (!e.target.closest('button, #detach-btn')) userInput.focus();
    });

    sendBtn.onclick = handleSend;
    userInput.onkeypress = (e) => { if (e.key === 'Enter') handleSend(); };

    // If this model is already in the browser cache, load it automatically (no download button needed)
    async function autoLoadIfCached() {
      try {
        if (!window.caches) return;
        const adapter = await getGpuAdapter();
        const hasGpu = gpuAllowed();
        const f16 = adapter ? adapter.features.has('shader-f16') : true;
        let urls = [];
        for (const name of await caches.keys()) {
          const c = await caches.open(name);
          urls = urls.concat((await c.keys()).map(r => r.url));
        }
        for (let i = 0; i < MODELS.length; i++) {
          if (provider === 'llama') { if (i !== llamaIdx) continue; }
          else if (i === llamaIdx || (hasGpu ? failedModels.includes(i) : i !== cpuModelIdx)) continue;
          const dtype = (!hasGpu || (MODELS[i].dtype === 'q4f16' && !f16)) ? 'q4' : MODELS[i].dtype;
          if (urls.some(u => u.includes('/' + MODELS[i].id + '/') && u.includes('model_' + dtype + '.onnx'))) {
            setModel(i);
            statusText.innerText = 'Found cached model, loading...';
            loadModelBtn.click();
            return;
          }
        }
      } catch (e) { console.warn('Cache check failed:', e); }
    }
    if (provider === 'llama') setModel(llamaIdx);
    applyProvider();
    if (provider !== 'grok') autoLoadIfCached();

    renderHistory();
  </script>
</body>
</html>
